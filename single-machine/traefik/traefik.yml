# =====================================================================
#  Traefik static configuration  —  SINGLE MACHINE / MACHINE 1 (mon-net)
#
#  Docker network used for backend discovery: mon-net
#  (on Machine 3 change to:  kcnet)
# =====================================================================

providers:
  docker:
    exposedByDefault: false
    network: mon-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      middlewares:
        - secHeaders
  metrics:
    address: ":9102"
  traefik:
    address: ":8080"

tls:
  options:
    default:
      minVersion: VersionTLS12

api:
  dashboard: true
  insecure: false

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addServicesLabels: true

# Local/self-signed mode (no ACME): routers with `tls=true` and no certresolver
# get Traefik's built-in auto-generated certificate (browser shows a warning).
# Production: add a certificatesResolvers.letsencrypt ACME block here.

# Only enable if your backends present self-signed / internal-CA certs:
# serversTransport:
#   insecureSkipVerify: true