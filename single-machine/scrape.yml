# =====================================================================
#  vmagent scrape config — SINGLE MACHINE (all-in-one)
#  vmagent runs on mon-net, so it resolves services by container name.
# =====================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:9102"]
        labels:
          instance: 'traefik:all-in-one'
          host: all-in-one
          service: traefik

  - job_name: "node-self"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: monitoring-host

  - job_name: "keycloak"
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]   # Keycloak 26 management port (metrics/health)
        labels:
          instance: 'keycloak:all-in-one'
          host: all-in-one
          service: keycloak

  - job_name: "victoriametrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["victoria-metrics:8428"]
        labels:
          instance: 'victoria-metrics:all-in-one'
          host: all-in-one
          service: victoriametrics

  # ---------------------------------------------------------------------
  # PRODUCTION TARGETS
  # Paste your existing production scrape jobs here (node/blackbox/
  # fortigate/oci exporters, etc.). The remote-write target stays the
  # same; only the addresses change to mon-net DNS names.
