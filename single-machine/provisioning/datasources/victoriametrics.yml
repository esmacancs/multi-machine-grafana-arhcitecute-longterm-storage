apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    # Optional: if you want to route through vmauth with basic auth
    # basicAuth: true
    # basicAuthUser: grafana
    # secureJsonData:
    #   basicAuthPassword: ${GF_DS_BASIC_AUTH_PASSWORD}