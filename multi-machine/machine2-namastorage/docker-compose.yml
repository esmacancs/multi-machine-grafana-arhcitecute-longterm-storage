  # fortigate-exporter:
  #   image: <existing image/digest>
  #   container_name: fortigate-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "${STORAGE_IP}:9710:9710"
  #   deploy: { resources: { limits: { memory: 128m } } }
  #   security_opt: [ "no-new-privileges:true" ]
  #
  # oci-*-exporter:
  #   image: <existing image/digest>
  #   container_name: oci-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "${STORAGE_IP}:<port>:<port>"    # as used in scrape.yml
  #   deploy: { resources: { limits: { memory: 128m } } }
  #   security_opt: [ "no-new-privileges:true" ]
  # ---------------------------------------------------------------------